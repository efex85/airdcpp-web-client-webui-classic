# Builds the image and pushes it to Docker Hub. Runs only when started by hand:
# Actions > Build Docker image > Run workflow
#
# Needed under Settings > Secrets and variables > Actions:
#   Variable  DOCKERHUB_USERNAME   the Docker Hub user that signs in
#   Secret    DOCKERHUB_TOKEN      a Docker Hub access token that may push
name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Tags to push
        type: choice
        required: true
        default: test
        options:
          - test
          - date-time and latest

permissions:
  contents: read

env:
  IMAGE: rafsis/airdcpp-web-client-webui-classic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the tags
        id: tags
        env:
          CHOICE: ${{ inputs.tags }}
        run: |
          case "$CHOICE" in
            "test")
              tags="$IMAGE:test"
              ;;
            "date-time and latest")
              # Swedish time; the runner's own clock is in UTC
              tags="$IMAGE:$(TZ=Europe/Stockholm date +%Y%m%d-%H%M),$IMAGE:latest"
              ;;
            *)
              echo "Unknown choice: $CHOICE" >&2
              exit 1
              ;;
          esac
          echo "Tags: $tags"
          echo "list=$tags" >> "$GITHUB_OUTPUT"

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Without a "context" the action builds the commit that the workflow was started on, so no checkout is needed
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # As build.sh: from scratch, with the current base images
          no-cache: true
          pull: true
